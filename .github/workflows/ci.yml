name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high --omit=dev
      - run: npm audit --audit-level=critical
      # CI only verifies that the site builds; the real Impressum address gate applies to deploys.
      - run: npm run build
        env:
          ALLOW_INCOMPLETE_LEGAL: '1'
